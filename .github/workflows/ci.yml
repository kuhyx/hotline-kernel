name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: File length (250-line cap)
        run: bash scripts/check-file-length.sh --all
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - name: Invariant soak
        run: npm run soak -- 3
