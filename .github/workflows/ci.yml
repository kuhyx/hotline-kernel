name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: File length (250-line cap)
        run: bash scripts/check-file-length.sh --all
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm coverage
      - run: pnpm build
      - name: Invariant soak
        run: pnpm soak 3
